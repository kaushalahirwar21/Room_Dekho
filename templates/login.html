{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2 class="text-center mb-4 text-primary">Welcome Back</h2>
    
    <div id="alertBox" style="display:none; padding: 10px; border-radius: 6px; margin-bottom: 15px; color: #fff; background-color: #ef4444;"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%">Login</button>
    </form>
    <div class="text-center mt-4" style="font-size: 0.9rem;">
        Don't have an account? <a href="/signup/" style="color: var(--primary)">Sign up here</a>
    </div>
</div>

<!-- OTP Verify Modal / Form directly hidden initially -->
<div class="form-container" id="otpContainer" style="display: none;">
    <h3 class="text-center mb-4">Verify Your Email</h3>
    <p class="text-muted text-center" style="font-size:0.9rem; margin-bottom: 20px;">An OTP has been sent. Please verify to login.</p>
    <form id="otpForm">
        <div class="form-group">
            <label>Enter 6-digit OTP</label>
            <input type="text" id="otpCode" class="form-control" required maxlength="6">
        </div>
        <button type="submit" class="btn" style="width: 100%">Verify OTP & Login</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentEmail = "";

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        
        try {
            const res = await fetch('/api/accounts/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                localStorage.setItem('role', data.user.role);
                localStorage.setItem('user_id', data.user.id);
                if (data.user.is_superuser === true || data.user.is_superuser === 'true' || data.user.role === 'Admin') {
                    window.location.href = '/admin/';
                } else {
                    window.location.href = '/dashboard/';
                }
            } else {
                if (res.status === 403 && data.error && data.error.includes("not verified")) {
                    currentEmail = email;
                    document.getElementById('loginForm').parentElement.style.display = 'none';
                    document.getElementById('otpContainer').style.display = 'block';
                } else {
                    alertBox.style.display = 'block';
                    alertBox.textContent = data.error || data.detail || 'Login failed';
                }
            }
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.textContent = 'Network Error';
        }
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const otpCode = document.getElementById('otpCode').value;
        
        try {
            const res = await fetch('/api/accounts/verify-otp/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail, otp_code: otpCode })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                localStorage.setItem('role', data.user.role);
                localStorage.setItem('user_id', data.user.id);
                if (data.user.is_superuser === true || data.user.is_superuser === 'true' || data.user.role === 'Admin') {
                    window.location.href = '/admin/';
                } else {
                    window.location.href = '/dashboard/';
                }
            } else {
                alert(data.error || 'Verification failed');
            }
        } catch (err) {
            alert('Network Error');
        }
    });
</script>
{% endblock %}
